kind = "web"
previewPath = "/"
title = "CalAI — Food Calorie Tracker"
version = "1.0.0"
id = "artifacts/calai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20976

[services.development]
run = "pnpm --filter @workspace/calai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/calai", "run", "build" ]
publicDir = "artifacts/calai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20976"
BASE_PATH = "/"
